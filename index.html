<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>非</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #111;
        color: #eee;
        font-family: monospace;
        min-height: 100vh;
    }

    button {
        font-family: monospace;
        cursor: pointer;
    }

    #landing {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        text-align: center;
    }

    h1 {
        font-family: "FangSong", "Fang Song Ti", serif;
        font-size: 2.5rem;
    }

    #landing button {
        margin-top: 20px;
        padding: 10px 20px;
        font-size: 1rem;
        background-color: #222;
        color: #eee;
        border: 1px solid #555;
        border-radius: 5px;
        transition: background 0.3s;
    }

    #landing button:hover {
        background-color: #333;
    }

    #terminal {
        display: none;
        padding: 30px;
        max-width: 800px;
        margin: auto;
    }

    .top {
        color: #888;
        margin-bottom: 20px;
    }

    .welcome {
        min-height: 55px;
        margin-bottom: 25px;
        line-height: 1.7;
        transition: all 0.5s ease;
    }

    #screen {
        border-top: 1px solid #333;
        padding-top: 15px;
    }

    .content {
        color: #888;
        line-height: 1.5;
    }

    .file-row {
        display: flex;
        align-items: center;
        gap: 18px;
    }

    .file {
        display: inline-block;
        margin: 0;
        padding: 3px 0;
        background: none;
        border: none;
        color: #aaa;
        font-size: 15px;
        line-height: 1.2;
    }

    .file:hover {
        color: white;
    }

    .back {
        display: inline-block;
        margin-top: 12px;
        padding: 3px 0;
        background: none;
        border: none;
        color: #666;
        font-size: 15px;
    }

    .back:hover {
        color: white;
    }

    .terminal-button {
        padding: 3px 0;
        background: none;
        border: none;
        color: #aaa;
        font-size: 15px;
    }

    .terminal-button:hover {
        color: white;
    }

    #floatingPage {
        display: none;
        position: fixed;
        inset: 0;
        background: #111;
        overflow: hidden;
        z-index: 100;
    }

    #floatingBack {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 200;
        padding: 3px 0;
        background: none;
        border: none;
        color: #555;
        font-family: monospace;
        font-size: 15px;
    }

    #floatingBack:hover {
        color: white;
    }

    .symbol {
        position: absolute;
        color: #777;
        font-size: 20px;
        pointer-events: none;
        animation: floatUp linear forwards;
    }

    @keyframes floatUp {

        from {
            transform: translateY(100vh) rotate(0deg);
            opacity: 0;
        }

        15% {
            opacity: 1;
        }

        85% {
            opacity: 1;
        }

        to {
            transform: translateY(-120px) rotate(360deg);
            opacity: 0;
        }

    }

</style>
</head>


<body>

<div id="landing">

    <h1>漂游中…</h1>

    <button onclick="enterSite()">
        More
    </button>

</div>

<div id="terminal">

    <div class="top">
        乐 | shr.exe
        <br>
        ────────────────────
    </div>


    <div class="welcome" id="welcomeText">
        welcome.<br>
        nothing is wrong.
    </div>


    <div id="screen">

        <button class="terminal-button" onclick="lookAround()">
            [ look around ]
        </button>

        <br>

        <button class="terminal-button" onclick="showAbout()">
            [ about ]
        </button>

    </div>

</div>



<!-- =========================
     FLOATING PAGE
========================= -->

<div id="floatingPage">

    <button id="floatingBack" onclick="closeFloating()">
        [ ← back ]
    </button>

</div>



<script>


/* =========================
   VARIABLES
========================= */

let explorationStage = 0;

let floatingInterval;

const symbols = [
    "?",
    "....",
    "空",
    "¯\\_(ツ)_/¯",
    "null",
    "∅",
    "？？？",
    "∆",
    "我爱沙"
];


function enterSite() {

    document.getElementById("landing").style.display = "none";

    document.getElementById("terminal").style.display = "block";

}

function lookAround() {

    explorationStage++;

    const screen = document.getElementById("screen");

    if (explorationStage === 1) {

        screen.innerHTML = `
            <div class="content">
                nothing here.
                <br><br>

                <button class="terminal-button" onclick="lookAround()">
                    [ look around ]
                </button>
            </div>
        `;

    }

    else if (explorationStage === 2) {

        screen.innerHTML = `
            <div class="content">

                <div class="file-row">

                    <button class="file" onclick="openFile('01')">
                        01.txt
                    </button>

                    <button class="terminal-button" onclick="lookAround()">
                        [ look around ]
                    </button>

                </div>

            </div>
        `;

    }


    else if (explorationStage === 3) {

        screen.innerHTML = `
            <div class="content">

                <div class="file-row">

                    <button class="file" onclick="openFile('01')">
                        01.txt
                    </button>

                    <button class="file" onclick="openFile('02')">
                        02.txt
                    </button>

                    <button class="terminal-button" onclick="lookAround()">
                        [ look around ]
                    </button>

                </div>

            </div>
        `;

    }

    else {

        showDirectory();

    }

}

function showDirectory() {

    const screen = document.getElementById("screen");


    const mysteriousFile = Math.random() < 0.35;


    const mysteryButton = mysteriousFile
        ? `
            <button class="file" onclick="openFloatingFile()">
                ???.txt
            </button>
        `
        : "";


    screen.innerHTML = `
        <div class="content">

            <div class="file-row">

                <button class="file" onclick="openFile('01')">
                    01.txt
                </button>

                <button class="file" onclick="openFile('02')">
                    02.txt
                </button>

                ${mysteryButton}

            </div>

            <button class="back" onclick="returnHome()">
                [ ← back ]
            </button>

        </div>
    `;

}

function openFile(file) {

    const screen = document.getElementById("screen");

    if (file === "01") {

        screen.innerHTML = `
            <div class="content">

                01.txt

                <br><br>

                there was nothing here.

                <br><br>

                probably.

                <br><br>

                <button class="back" onclick="returnDirectory()">
                    [ ← back ]
                </button>

            </div>
        `;

    }

    if (file === "02") {

        screen.innerHTML = `
            <div class="content">

                02.txt

                <br><br>

                file corrupted.

                <br>
                file intact.

                <br><br>

                <button class="back" onclick="returnDirectory()">
                    [ ← back ]
                </button>

            </div>
        `;

    }

}

function openFloatingFile() {

    startBreaking();

    document.getElementById("terminal").style.display = "none";

    document.getElementById("floatingPage").style.display = "block";

    startFloating();

}

function startBreaking() {

    const welcome = document.getElementById("welcomeText");


    setTimeout(() => {

        welcome.innerHTML = `
            welc0me.<br>
            nothing is wrong.
        `;

    }, 2000);

    setTimeout(() => {

        welcome.innerHTML = `
            welc0me.<br>
            n̷̬̰̤͍̹̯̳̪̯̪̭͚̰̟͈̒̾ǒ̴̧̯̬͉̻̫̍̎ẗ̸̝́͛͑͊̒̊̀̈̓̈́̕͝h̷̡͔̝͎͕͉̮̭͇͙̼͔͇̝͈̚i̸͓͍̼̗͉̙͂̔̉̅̽̉̑͗̔͝n̶͉̦̒g̴̡͉̞̗̖͙̜̤̥̓̽̃̔͆͌̅̀̎͛̔͗͂͋ ̵̹̋̔̈̀̿̒͠i̸̬̤̪͙̽͒̿́͌̈́̍͠͠s̴̺̲̜̫͙̪̓̈́̾̀́̓̃͐̆̏́͒͝ ̶̨̡͕̜͎͗͑w̸̢̤͇͈̗͓͙͉̰͇͓̲̝͊͂̉́̑̒̊̅̋̓̒̀̕͠r̷̛̹̯͎̹̥͎̗̿̎͋̿́̒̀̂̐̈́̎̚ọ̸̡̤̳̟͔̜̱͎̤̬̖̣̘̝̒̀̒̀̈́̆̕n̸̙̊́ǵ̴̡̥͈͇̜̤̱͚̍͌̕.̶̧̥̯̹̟͇̻͍͖͖̝͎́
        `;

    }, 5000);

}

function startFloating() {

    createSymbol();

    floatingInterval = setInterval(() => {

        createSymbol();

    }, 450);

}


function createSymbol() {

    const page = document.getElementById("floatingPage");

    const symbol = document.createElement("div");

    symbol.className = "symbol";


    symbol.textContent =
        symbols[Math.floor(Math.random() * symbols.length)];


    symbol.style.left =
        Math.random() * 100 + "%";


    symbol.style.animationDuration =
        (3 + Math.random() * 5) + "s";


    symbol.style.fontSize =
        (14 + Math.random() * 14) + "px";


    page.appendChild(symbol);


    setTimeout(() => {

        symbol.remove();

    }, 9000);

}

function closeFloating() {

    clearInterval(floatingInterval);


    document.querySelectorAll(".symbol").forEach(symbol => {
        symbol.remove();
    });


    document.getElementById("floatingPage").style.display = "none";

    document.getElementById("terminal").style.display = "block";


    returnDirectory();

}

function returnDirectory() {

    showDirectory();

}

function showAbout() {

    document.getElementById("screen").innerHTML = `
        <div class="content">
            stop clicking around
            <br><br>
            <br><br>

            the files keep breathing and i cannot stop themm

            <br><br>
            <br><br>
            <br><br>
            <br><br>
            <br><br>

            i w1ll find 
            <br><br>
            y0u
            <br><br>

            <button class="back" onclick="returnHome()">
                [ ← back ]
            </button>

        </div>
    `;

}

function returnHome() {

    document.getElementById("screen").innerHTML = `
        <button class="terminal-button" onclick="lookAround()">
            [ look around ]
        </button>

        <br>

        <button class="terminal-button" onclick="showAbout()">
            [ about ]
        </button>
    `;

}


</script>

</body>
</html>
